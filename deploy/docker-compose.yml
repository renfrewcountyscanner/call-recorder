services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-call_recorder}
      POSTGRES_USER: ${POSTGRES_USER:-call_recorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a private .env file}
    volumes:
      - ../runtime/postgres:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  audio-init:
    image: alpine:3.21
    command: ["sh", "-c", "install -d -m 0750 /var/lib/call-recorder/audio /var/lib/call-recorder/secrets && chown 10001:10001 /var/lib/call-recorder/audio /var/lib/call-recorder/secrets && chmod 0750 /var/lib/call-recorder/audio /var/lib/call-recorder/secrets"]
    volumes:
      - ../runtime/audio:/var/lib/call-recorder/audio
      - ../runtime/secrets:/var/lib/call-recorder/secrets
  backend:
    build:
      context: ../backend
      args:
        COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      audio-init:
        condition: service_completed_successfully
    environment:
      CALL_RECORDER_LISTEN_ADDRESS: 0.0.0.0
      CALL_RECORDER_LISTEN_PORT: 8080
      CALL_RECORDER_DATABASE_URL: postgresql://${POSTGRES_USER:-call_recorder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-call_recorder}?sslmode=disable
      CALL_RECORDER_AUDIO_ROOT: /var/lib/call-recorder/audio
      CALL_RECORDER_SECRETS_ROOT: /var/lib/call-recorder/secrets
      CALL_RECORDER_BOOTSTRAP_SENDER_ID: ${CALL_RECORDER_BOOTSTRAP_SENDER_ID:-example-sender}
      CALL_RECORDER_BOOTSTRAP_SENDER_KEY: ${CALL_RECORDER_BOOTSTRAP_SENDER_KEY:?set a non-example sender key in private .env}
      CALL_RECORDER_LEGACY_INGESTION_ENABLED: ${CALL_RECORDER_LEGACY_INGESTION_ENABLED:-false}
      CALL_RECORDER_LEGACY_DEBUG: ${CALL_RECORDER_LEGACY_DEBUG:-false}
      CALL_RECORDER_LEGACY_AUTH_ID: ${CALL_RECORDER_LEGACY_AUTH_ID:-}
      CALL_RECORDER_LEGACY_API_KEY: ${CALL_RECORDER_LEGACY_API_KEY:-}
      CALL_RECORDER_ADMIN_ENABLED: ${CALL_RECORDER_ADMIN_ENABLED:-false}
      # Temporary local-only maintenance option. Keep false in normal deployments.
      CALL_RECORDER_ADMIN_OPEN: ${CALL_RECORDER_ADMIN_OPEN:-false}
      CALL_RECORDER_ADMIN_TOKEN: ${CALL_RECORDER_ADMIN_TOKEN:-}
      CALL_RECORDER_SESSION_SECRET: ${CALL_RECORDER_SESSION_SECRET:-}
      CALL_RECORDER_CLOUDFLARE_ACCESS_ENABLED: ${CALL_RECORDER_CLOUDFLARE_ACCESS_ENABLED:-false}
      CALL_RECORDER_CLOUDFLARE_ADMIN_EMAIL: ${CALL_RECORDER_CLOUDFLARE_ADMIN_EMAIL:-}
      CALL_RECORDER_CLOUDFLARE_TRUSTED_PROXY_IPS: ${CALL_RECORDER_CLOUDFLARE_TRUSTED_PROXY_IPS:-}
      TZ: ${TZ:-America/Toronto}
    ports:
      - "${CALL_RECORDER_PORT:-8080}:8080"
    volumes:
      - ../runtime/audio:/var/lib/call-recorder/audio
      - ../runtime/secrets:/var/lib/call-recorder/secrets
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  notification-worker:
    profiles: ["notifications"]
    build:
      context: ../backend
      args:
        COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/call-recorder-admin"]
    command: ["notifications", "run"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CALL_RECORDER_DATABASE_URL: postgresql://${POSTGRES_USER:-call_recorder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-call_recorder}?sslmode=disable
      TZ: ${TZ:-America/Toronto}
    user: "10001:10001"
  transcription-worker:
    build:
      context: ../backend
      args:
        COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do /usr/local/bin/call-recorder-admin transcription run || true; sleep 15; done"]
    depends_on:
      postgres:
        condition: service_healthy
      audio-init:
        condition: service_completed_successfully
    environment:
      CALL_RECORDER_DATABASE_URL: postgresql://${POSTGRES_USER:-call_recorder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-call_recorder}?sslmode=disable
      CALL_RECORDER_AUDIO_ROOT: /var/lib/call-recorder/audio
      CALL_RECORDER_SECRETS_ROOT: /var/lib/call-recorder/secrets
      TZ: ${TZ:-America/Toronto}
    volumes:
      - ../runtime/audio:/var/lib/call-recorder/audio:ro
      - ../runtime/secrets:/var/lib/call-recorder/secrets:ro
    user: "10001:10001"
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/call-recorder-admin transcription diagnose"]
      interval: 30s
      timeout: 10s
      retries: 3
    # No ports exposed. A disabled configuration is a healthy idle state.
