services:
  postgres:
    volumes:
      - ../.test-runtime/postgres:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
  audio-init:
    volumes:
      - ../.test-runtime/audio:/var/lib/call-recorder/audio
      - ../.test-runtime/secrets:/var/lib/call-recorder/secrets
  backend:
    environment:
      CALL_RECORDER_TEST_FAIL_FINALIZE: ${CALL_RECORDER_TEST_FAIL_FINALIZE:-false}
    ports:
      - "18080:8080"
    volumes:
      - ../.test-runtime/audio:/var/lib/call-recorder/audio
      - ../.test-runtime/secrets:/var/lib/call-recorder/secrets
  transcription-worker:
    volumes:
      - ../.test-runtime/audio:/var/lib/call-recorder/audio:ro
      - ../.test-runtime/secrets:/var/lib/call-recorder/secrets:ro
  fake-transcriber:
    image: python:3.13-alpine
    command: ["python", "/tests/fake-transcriber.py", "8080"]
    volumes:
      - ../tests:/tests:ro
    expose:
      - "8080"

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
