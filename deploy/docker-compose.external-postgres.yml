x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 1g
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  migrate:
    <<: *app-hardening
    build:
      context: ../backend
      args:
        COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    entrypoint: ["/usr/local/bin/call-recorder-admin"]
    command: ["migrate"]
    environment:
      CALL_RECORDER_DATABASE_URL: ${CALL_RECORDER_DATABASE_URL:?set CALL_RECORDER_DATABASE_URL in your .env file}
  audio-init:
    image: alpine:3.21
    command: ["sh", "-c", "install -d -m 0750 /var/lib/call-recorder/audio /var/lib/call-recorder/secrets /var/lib/call-recorder/exports && chown 10001:10001 /var/lib/call-recorder/audio /var/lib/call-recorder/secrets /var/lib/call-recorder/exports && chmod 0750 /var/lib/call-recorder/audio /var/lib/call-recorder/secrets /var/lib/call-recorder/exports"]
    volumes:
      - ${CALL_RECORDER_AUDIO_HOST_PATH:-../audio}:/var/lib/call-recorder/audio
      - ${CALL_RECORDER_SECRETS_HOST_PATH:-../runtime/secrets}:/var/lib/call-recorder/secrets
      - ${CALL_RECORDER_EXPORTS_HOST_PATH:-../runtime/exports}:/var/lib/call-recorder/exports
  backend:
    <<: *app-hardening
    build:
      context: ../backend
      args:
        COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    depends_on:
      audio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      CALL_RECORDER_LISTEN_ADDRESS: 0.0.0.0
      CALL_RECORDER_LISTEN_PORT: 8080
      CALL_RECORDER_DATABASE_URL: ${CALL_RECORDER_DATABASE_URL:?set CALL_RECORDER_DATABASE_URL in your .env file}
      CALL_RECORDER_AUDIO_ROOT: /var/lib/call-recorder/audio
      CALL_RECORDER_SECRETS_ROOT: /var/lib/call-recorder/secrets
      CALL_RECORDER_EXPORT_ROOT: /var/lib/call-recorder/exports
      CALL_RECORDER_BOOTSTRAP_SENDER_ID: ${CALL_RECORDER_BOOTSTRAP_SENDER_ID:-example-sender}
      CALL_RECORDER_BOOTSTRAP_SENDER_KEY: ${CALL_RECORDER_BOOTSTRAP_SENDER_KEY:?set a non-example sender key in your .env file}
      CALL_RECORDER_LEGACY_INGESTION_ENABLED: ${CALL_RECORDER_LEGACY_INGESTION_ENABLED:-false}
      CALL_RECORDER_LEGACY_DEBUG: ${CALL_RECORDER_LEGACY_DEBUG:-false}
      CALL_RECORDER_LEGACY_QUARANTINE_FAILURES: ${CALL_RECORDER_LEGACY_QUARANTINE_FAILURES:-10}
      CALL_RECORDER_LEGACY_QUARANTINE_GRACE_SECONDS: ${CALL_RECORDER_LEGACY_QUARANTINE_GRACE_SECONDS:-30}
      CALL_RECORDER_LEGACY_AUTH_ID: ${CALL_RECORDER_LEGACY_AUTH_ID:-}
      CALL_RECORDER_LEGACY_API_KEY: ${CALL_RECORDER_LEGACY_API_KEY:-}
      CALL_RECORDER_ADMIN_ENABLED: ${CALL_RECORDER_ADMIN_ENABLED:-false}
      # Temporary local-only maintenance option. Keep false in normal deployments.
      CALL_RECORDER_ADMIN_OPEN: ${CALL_RECORDER_ADMIN_OPEN:-false}
      CALL_RECORDER_ADMIN_TOKEN: ${CALL_RECORDER_ADMIN_TOKEN:-}
      CALL_RECORDER_AUTH_REQUIRED: ${CALL_RECORDER_AUTH_REQUIRED:-true}
      CALL_RECORDER_LOCAL_AUTH_ENABLED: ${CALL_RECORDER_LOCAL_AUTH_ENABLED:-true}
      CALL_RECORDER_SESSION_SECRET: ${CALL_RECORDER_SESSION_SECRET:?set CALL_RECORDER_SESSION_SECRET in your .env file}
      CALL_RECORDER_SESSION_COOKIE_SECURE: ${CALL_RECORDER_SESSION_COOKIE_SECURE:-true}
      CALL_RECORDER_SESSION_MAX_AGE_SECONDS: ${CALL_RECORDER_SESSION_MAX_AGE_SECONDS:-2592000}
      CALL_RECORDER_AUTH_LOGIN_URL: ${CALL_RECORDER_AUTH_LOGIN_URL:-}
      CALL_RECORDER_CLOUDFLARE_ACCESS_ENABLED: ${CALL_RECORDER_CLOUDFLARE_ACCESS_ENABLED:-false}
      CALL_RECORDER_CLOUDFLARE_ADMIN_EMAIL: ${CALL_RECORDER_CLOUDFLARE_ADMIN_EMAIL:-}
      CALL_RECORDER_CLOUDFLARE_TRUSTED_PROXY_IPS: ${CALL_RECORDER_CLOUDFLARE_TRUSTED_PROXY_IPS:-}
      CALL_RECORDER_NOTIFICATION_SECRET: ${CALL_RECORDER_NOTIFICATION_SECRET:-}
      TZ: ${TZ:-America/Toronto}
    ports:
      - "${CALL_RECORDER_BIND_ADDRESS:-127.0.0.1}:${CALL_RECORDER_PORT:-8080}:8080"
    volumes:
      - ${CALL_RECORDER_AUDIO_HOST_PATH:-../audio}:/var/lib/call-recorder/audio
      - ${CALL_RECORDER_SECRETS_HOST_PATH:-../runtime/secrets}:/var/lib/call-recorder/secrets
      - ${CALL_RECORDER_EXPORTS_HOST_PATH:-../runtime/exports}:/var/lib/call-recorder/exports
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  notification-worker:
    <<: *app-hardening
    build:
      context: ../backend
      args:
        COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do /usr/local/bin/call-recorder-admin notifications run || true; sleep 15; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      CALL_RECORDER_DATABASE_URL: ${CALL_RECORDER_DATABASE_URL:?set CALL_RECORDER_DATABASE_URL in your .env file}
      CALL_RECORDER_PUBLIC_URL: ${CALL_RECORDER_PUBLIC_URL:-https://logger.renfrewcountyscanner.com}
      CALL_RECORDER_NOTIFICATION_SECRET: ${CALL_RECORDER_NOTIFICATION_SECRET:-}
      TZ: ${TZ:-America/Toronto}
    user: "10001:10001"
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/call-recorder-admin notifications diagnose"]
      interval: 30s
      timeout: 10s
      retries: 3
  transcription-worker:
    <<: *app-hardening
    build:
      context: ../backend
      args:
        COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do /usr/local/bin/call-recorder-admin transcription run || true; sleep 15; done"]
    depends_on:
      audio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      CALL_RECORDER_DATABASE_URL: ${CALL_RECORDER_DATABASE_URL:?set CALL_RECORDER_DATABASE_URL in your .env file}
      CALL_RECORDER_AUDIO_ROOT: /var/lib/call-recorder/audio
      CALL_RECORDER_SECRETS_ROOT: /var/lib/call-recorder/secrets
      TZ: ${TZ:-America/Toronto}
    volumes:
      - ${CALL_RECORDER_AUDIO_HOST_PATH:-../audio}:/var/lib/call-recorder/audio:ro
      - ${CALL_RECORDER_SECRETS_HOST_PATH:-../runtime/secrets}:/var/lib/call-recorder/secrets:ro
    user: "10001:10001"
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/call-recorder-admin transcription diagnose"]
      interval: 30s
      timeout: 10s
      retries: 3
    # No ports exposed. A disabled configuration is a healthy idle state.
  dataset-worker:
    <<: *app-hardening
    build:
      context: ../backend
      args:
        COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/call-recorder-admin"]
    command: ["datasets", "run"]
    depends_on:
      audio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      CALL_RECORDER_DATABASE_URL: ${CALL_RECORDER_DATABASE_URL:?set CALL_RECORDER_DATABASE_URL in your .env file}
      CALL_RECORDER_AUDIO_ROOT: /var/lib/call-recorder/audio
      CALL_RECORDER_EXPORT_ROOT: /var/lib/call-recorder/exports
      TZ: ${TZ:-America/Toronto}
    volumes:
      - ${CALL_RECORDER_AUDIO_HOST_PATH:-../audio}:/var/lib/call-recorder/audio:ro
      - ${CALL_RECORDER_EXPORTS_HOST_PATH:-../runtime/exports}:/var/lib/call-recorder/exports
    user: "10001:10001"
