{{define "index.html"}}
{{template "head" .}}
{{template "top" .}}
<h1>Calls</h1>
<div id="live-status" class="live-status" role="status" aria-live="polite">Live updates: connecting…</div>
{{if .Error}}<div class="alert danger" role="alert">{{.Error}}</div>{{end}}
<details class="filters" open>
  <summary>Filters</summary>
  <form id="filter-form" hx-get="/calls" hx-target="#calls" hx-swap="innerHTML" hx-trigger="submit, keyup changed delay:350ms from:input, change changed from:select, change changed from:input[type=date]">
    <div class="filter-grid">
      <label>Search <input name="q" value="{{.Filter.Q}}" autocomplete="off" placeholder="Alias, ID, or transcript"></label>
      <label>Sender <input name="sender" value="{{.Filter.Sender}}" autocomplete="off"></label>
      <label>System <input name="system" value="{{.Filter.System}}" autocomplete="off"></label>
      <label>Site <input name="site" value="{{.Filter.Site}}" autocomplete="off"></label>
      <label>Receiver <input name="receiver" value="{{.Filter.Receiver}}" autocomplete="off"></label>
      <label>Talkgroup <input name="talkgroup" value="{{.Filter.Talkgroup}}" autocomplete="off"></label>
      <label>Radio ID <input name="radio" value="{{.Filter.Radio}}" autocomplete="off"></label>
      <label>Call type <input name="call_type" value="{{.Filter.CallType}}" autocomplete="off"></label>
      <label>Frequency <input name="frequency" value="{{.Filter.Frequency}}" autocomplete="off"></label>
      <label>Min duration (sec) <input name="min_duration" value="{{.Filter.MinDuration}}" inputmode="decimal"></label>
      <label>Max duration (sec) <input name="max_duration" value="{{.Filter.MaxDuration}}" inputmode="decimal"></label>
      <label class="check"><input type="checkbox" name="patched" value="1" {{if .Filter.Patched}}checked{{end}}> Patched calls only</label>
      <label>From <input type="date" name="from" value="{{.Filter.From}}"></label>
      <label>To <input type="date" name="to" value="{{.Filter.To}}"></label>
      <label>Per page
        <select name="page_size">
          <option value="25" {{if eq .Filter.PageSize 25}}selected{{end}}>25</option>
          <option value="50" {{if eq .Filter.PageSize 50}}selected{{end}}>50</option>
          <option value="100" {{if eq .Filter.PageSize 100}}selected{{end}}>100</option>
          <option value="200" {{if eq .Filter.PageSize 200}}selected{{end}}>200</option>
        </select>
      </label>
    </div>
    <div class="filter-actions">
      <button class="btn primary" type="submit">Apply filters</button>
      <a class="btn ghost" href="/" id="filter-reset">Reset</a>
      <a class="btn ghost" href="/export/calls.csv?{{.RawQuery}}">Export CSV</a>
    </div>
  </form>
</details>
<section id="calls" hx-get="/calls?{{.RawQuery}}" hx-trigger="load" hx-swap="innerHTML" aria-label="Call list">
  <div class="loading">Loading calls…</div>
</section>
{{template "playerbar" .}}
{{template "bottom" .}}
{{end}}
