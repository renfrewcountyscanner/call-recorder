{{define "admin_login.html"}}{{template "head" .}}{{template "top" .}}
<div class="login-card">
  <h1>Administration sign-in</h1>
  {{if .Error}}<div class="alert danger" role="alert">{{.Error}}</div>{{end}}
  <form method="post" action="/admin/login">
    <div class="form-grid">
      <label>Username <input name="username" type="text" autocomplete="username" required autofocus></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    </div>
    <div class="form-actions">
      <button class="btn primary" type="submit">Sign in</button>
    </div>
  </form>
  <p class="help">Sign-in creates a one-hour session. Contact your administrator for account access.</p>
</div>
{{template "bottom" .}}{{end}}
