version: 1

logger:
  url: https://logger.example.com
  sender_id: windows-proscan
  # Keep the key outside this YAML file. The installer restricts this file to
  # LocalSystem and local administrators.
  api_key_file: 'C:\ProgramData\CallLogger\sender.key'
  request_timeout_seconds: 60

spool_directory: 'C:\ProgramData\CallLogger\spool'
log_file: 'C:\ProgramData\CallLogger\proscan-uploader.log'
timezone: America/Toronto
settle_seconds: 3
rescan_seconds: 30
upload_workers: 2
max_audio_bytes: 104857600
include_existing: true
# Delete each original ProScan recording only after the logger confirms it.
# Set false to retain source recordings after upload.
delete_uploaded_files: true

watch_directories:
  - path: 'E:\ProScan\Digital'
    system_id: SCANNER-DIGITAL
    receiver_id: BCD996P2
    recursive: true
    use_tpe2_radio_id: true
    proscan_system_as_site: true

  - path: 'E:\ProScan\Analog'
    system_id: SCANNER-ANALOG
    receiver_id: BCT15X
    recursive: true
    use_tpe2_radio_id: false
    proscan_system_as_site: true
